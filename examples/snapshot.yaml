# Snapshot fs-pvc from filesystem.yaml and restore it into a larger volume.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: fs-snap
spec:
  volumeSnapshotClassName: zstack-disk-snapshot
  source:
    persistentVolumeClaimName: fs-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fs-restored
spec:
  storageClassName: zstack-disk
  accessModes: [ReadWriteOnce]
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: fs-snap
  resources:
    requests:
      storage: 8Gi
