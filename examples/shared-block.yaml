# A ZStack shared volume attached to every node that runs one of the pods.
# Multi-node access works for raw block volumes only; the applications must
# coordinate their writes and bypass the page cache (O_DIRECT).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-pvc
spec:
  storageClassName: zstack-disk
  volumeMode: Block
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shared-app
  template:
    metadata:
      labels:
        app: shared-app
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: shared-app
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeDevices:
            - name: data
              devicePath: /dev/shared
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shared-pvc
