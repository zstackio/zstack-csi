{{- $registry := .Values.sidecars.registry }}
{{- $kubeletDir := .Values.node.kubeletDir }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-node
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-node
    spec:
      priorityClassName: system-node-critical
      {{- with .Values.node.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: driver
          image: {{ include "zstack-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
            - --driver-name={{ .Values.driverName }}
            - --max-volumes-per-node={{ .Values.node.maxVolumesPerNode }}
            - --v={{ .Values.node.logLevel }}
          securityContext:
            privileged: true
          ports:
            - name: healthz
              containerPort: 9809
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: {{ $kubeletDir }}
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
        - name: node-driver-registrar
          image: {{ $registry }}/{{ .Values.sidecars.nodeDriverRegistrar }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ include "zstack-csi.socketDir" . }}/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: {{ $registry }}/{{ .Values.sidecars.livenessProbe }}
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:9809
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ include "zstack-csi.socketDir" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ $kubeletDir }}/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: {{ $kubeletDir }}
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
