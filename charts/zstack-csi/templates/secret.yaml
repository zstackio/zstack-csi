{{- if not .Values.zstack.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zstack-csi.secretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  accessKeyId: {{ required "zstack.accessKeyId is required" .Values.zstack.accessKeyId | quote }}
  accessKeySecret: {{ required "zstack.accessKeySecret is required" .Values.zstack.accessKeySecret | quote }}
{{- end }}
